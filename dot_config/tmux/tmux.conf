##### Terminal ###############################################################

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g mouse on

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

set -s escape-time 10


##### TPM ####################################################################

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'


##### Extrakto ###############################################################
#
# Broad fuzzy fallback.
#
# Use when:
#   - fingers/thumbs did not match what you want
#   - the text is farther back in scrollback
#   - you remember only part of the value
#   - you want an arbitrary normal word
#
# prefix + Tab -> open
# Tab          -> insert selection at cursor
# Enter        -> copy selection


set -g @plugin 'laktak/extrakto'

# Search all panes in this window, but bound history scanning.
# Avoid "window full" when tmux has a large history-limit.
set -g @extrakto_grab_area "window 500"

# Start with words; Ctrl-F can cycle to all/line.
set -g @extrakto_filter_order "word all line"


##### tmux-thumbs ############################################################
#
# Extremely fast visible-pane picker.
#
# prefix + Space
#
# Lowercase hint -> paste directly at cursor
# Uppercase hint -> only save to tmux buffer
#
# Important:
# thumbs has built-in matches that cannot currently be disabled.
# In particular:
#   0/1            may still be seen as a path
#   1234           is matched as a number

set -g @plugin 'fcsonline/tmux-thumbs'

# Shortest hints go to things nearest the cursor.
set -g @thumbs-reverse enabled

# Repeated values share one hint.
set -g @thumbs-unique enabled

# Normal hint = insert directly.
set -g @thumbs-command \
    'tmux set-buffer -- "{}" && tmux paste-buffer'

# Shifted hint = keep it in tmux buffer without inserting.
set -g @thumbs-upcase-command \
    'tmux set-buffer -- "{}"'


# Generic table cells.
#
# Examples:
#
#   nginx-deployment-7db9...    1/1    Running
#   kube-system                 coredns-...    1/1
#   integration-tests           ACTIVE
#
# Require:
#   - lowercase identifier-like value
#   - >= 5 characters
#   - table-style spacing after it
#
# This deliberately does NOT globally match every hyphenated word.
#
# Rust regex does not support look-around, therefore surrounding table
# whitespace is consumed while only the named capture becomes the hint.
set -g @thumbs-regexp-1 \
    '(?:^| {2,}|\t)(?P<match>[a-z0-9][a-z0-9._@+-]{4,})(?: {2,}|\t)'


# Plain dotted names are commonly worth reusing:
#
#   api.internal
#   controller.platform9.localnet
#   main.go
#   deployment.apps
#
# Numeric IPv4 addresses don't match because the final component must
# start with a letter; IPv4 already has a thumbs builtin anyway.
set -g @thumbs-regexp-2 \
    '(?P<match>(?:[A-Za-z0-9][A-Za-z0-9_-]*\.)+[A-Za-z][A-Za-z0-9_-]*)'


# Prefer the complete endpoint/network over thumbs' built-in plain IPv4.
#
#   10.10.11.217:6443
#   10.10.11.0/24
#
# Deliberately don't validate 0..255 or 0..65535. That adds complexity for
# practically no useful improvement in terminal output.
set -g @thumbs-regexp-3 \
    '(?P<match>(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?::[0-9]{1,5}|/[0-9]{1,2}))'


# MAC addresses are structured, uncommon enough to be high-value hints.
set -g @thumbs-regexp-4 \
    '(?P<match>(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2})'


# `git status` branch form not covered as nicely by generic words.
set -g @thumbs-regexp-5 \
    '^On branch (?P<match>[^ \t]{5,})$'


##### tmux-fingers ###########################################################
#
# Precise/default hint picker.
#
# prefix + F
#
# Selecting a hint inserts it directly at the cursor.
#
# Unlike thumbs, builtin pattern selection is configurable, so deliberately
# keep noisy patterns disabled.

set -g @plugin 'Morantron/tmux-fingers'

set -g @fingers-main-action ':paste:'
set -g @fingers-show-copied-notification 0

# We primarily want insertion. Don't modify the desktop clipboard every time.
set -g @fingers-use-system-clipboard 0


# IPv4, optionally including the part usually needed in the next command:
#
#   10.10.11.217
#   10.10.11.217:6443
#   10.10.11.0/24
#
# Keep this intentionally cheap instead of implementing strict IP validation.
set -g @fingers-pattern-ip \
    '(?<![0-9.])(?<match>(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?::[0-9]{1,5}|/[0-9]{1,2})?)(?![0-9.])'


# Useful paths only.
#
# Requirements:
#   - >= 5 characters
#   - contains at least one ASCII letter
#   - contains at least one slash
#
# Therefore:
#
#   ./foo               yes
#   /etc/hosts          yes
#   src/controller.go   yes
#   deployment/nginx    yes
#
#   0/1                 no
#   1/1                 no
#   10/20               no
#   a/b                 no
#
# Do NOT enable the builtin "path" pattern below. This replaces it.
set -g @fingers-pattern-path \
    '(?<match>(?=[.\w\-~$@/]{5})(?=[.\w\-~$@/]*[A-Za-z])[.\w\-~$@]*(?:/[.\w\-@]+)+/?)'


# Table cells.
#
# This is the main generic "names" matcher.
#
# It works for Kubernetes, OpenStack, Docker, systemctl output and many other
# CLI tables without trying to understand the individual applications.
#
# Two spaces / tab on both sides are the useful signal. Ordinary prose and
# shell commands normally use one space, which greatly reduces garbage hints.
#
# >= 5 chars means:
#   abc       -> type it yourself
#   web       -> type it yourself
#   nginx     -> hint
#   web-0     -> hint
#   default   -> hint
#   kube-system -> hint
set -g @fingers-pattern-table-cell \
    '(?:^| {2,}|\t)(?<match>[a-z0-9][a-z0-9._@+-]{4,})(?=(?: {2,}|\t)\S)'


# Plain dotted values.
#
# Useful beyond Kubernetes:
#
#   api.company.internal
#   host.example.com
#   controller.platform9.localnet
#   main.go
#   deployment.apps
#
# Final component starts with a letter, which prevents matching numeric
# IPv4 addresses here.
set -g @fingers-pattern-dotted \
    '(?<![A-Za-z0-9._-])(?<match>(?=[A-Za-z0-9._-]{5,})(?:[A-Za-z0-9][A-Za-z0-9_-]*\.)+[A-Za-z][A-Za-z0-9_-]*)(?![A-Za-z0-9._-])'


# MAC address.
set -g @fingers-pattern-mac \
    '(?<![0-9A-Fa-f:])(?<match>(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2})(?![0-9A-Fa-f:])'


# `git status`:
#
#   On branch feature/retry-backoff
set -g @fingers-pattern-git-current-branch \
    '^On branch (?<match>\S{5,})$'


# Carefully selected builtins.
#
# Deliberately disabled:
#
#   ip          custom version above includes :port and /CIDR
#   path        custom version rejects 0/1 and other numeric ratios
#   digit       4-digit numbers create far too many hints
#   kubernetes  broad and unnecessary for our workflow
#
# sha has a useful accidental property: a 7+ digit numeric identifier also
# matches it. That's generally useful while avoiding noisy 4-digit numbers.
set -g @fingers-enabled-builtin-patterns \
    'uuid,sha,url,hex,kubernetes-pod,git-status,git-status-branch,diff'

##### Previous output fields #################################################
#
# Fast path for:
#
#   $ k -n kplane get po
#   api-server-7d8c9f-x2abc   1/1   Running
#
#   $ k -n kplane logs <prefix>a
#
# g = first field of nearest previous non-empty line
# G = second field

bind-key g run-shell '~/.config/tmux/scripts/paste-prev-field 1'
bind-key G run-shell '~/.config/tmux/scripts/paste-prev-field 2'

##### Theme ###################################################################

set -g @tokyo-night-tmux_theme 'night'
set -g @tokyo-night-tmux_transparent 1

# Filled-square window numbers with compact pane indicators.
set -g @tokyo-night-tmux_window_id_style 'fsquare'
set -g @tokyo-night-tmux_pane_id_style 'hide'
set -g @tokyo-night-tmux_zoom_id_style 'hide'

# Keep the right side intentionally minimal.
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_show_right_widgets 'datetime'

set -g @plugin 'janoamaral/tokyo-night-tmux'

##### Optional plugins #######################################################

# Session persistence:
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# Native tmux/terminal clipboard support should generally be enough.
# set -g @plugin 'tmux-plugins/tmux-yank'


##### Initialize TPM #########################################################
#
# Must remain last.

run '~/.config/tmux/plugins/tpm/tpm'