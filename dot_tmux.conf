# Claude Code recommended settings for tmux

# Let notifications and the progress bar pass through to the outer terminal
set -g allow-passthrough on

# Enable extended key support (needed for Shift+Enter and other key bindings)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Mouse support (wheel scrolling in fullscreen rendering mode)
set -g mouse on

# 256-color and true RGB color support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

# Faster key response (Claude doesn't need vim's default escape-time)
set -s escape-time 10
